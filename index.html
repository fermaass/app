<script>// Guardado: base de datos de Claude (privada por persona) + copia local en el navegador
(function () {
  var mem = {};
  var LS = "gymguia:";
  function lsGet(k) { try { return localStorage.getItem(LS + k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(LS + k, v); } catch (e) {} }
  function slug(k) { return encodeURIComponent(k).replace(/%/g, "~").replace(/\./g, "~2E"); }
  var ready = (async function () {
    try {
      if (!window.claude || !window.claude.use) return null;
      var db = await window.claude.use("db");
      var user = await window.claude.use("user");
      if (!db || !user) return null;
      var id = await user.id();
      if (!id) return null;
      return db.collection("data/users/" + id);
    } catch (e) { return null; }
  })();
  var queues = {};
  function enqueue(k, fn) {
    var p = (queues[k] || Promise.resolve()).then(fn, fn);
    queues[k] = p.catch(function () {});
    return p;
  }
  window.__gymStatus = { cloud: null };
  ready.then(function (c) { window.__gymStatus.cloud = !!c; });
  window.storage = {
    get: async function (k) {
      if (k in mem) return mem[k] == null ? null : { key: k, value: mem[k] };
      var col = await ready;
      var v = null;
      if (col) {
        try {
          var snap = await col.doc(slug(k)).get();
          if (snap.exists) { var d = snap.data(); v = d && typeof d.v === "string" ? d.v : null; }
        } catch (e) {}
      }
      if (v == null) {
        v = lsGet(k);
        if (v != null && col) { var vv = v; enqueue(k, function () { return col.doc(slug(k)).set({ v: vv, t: Date.now() }); }); }
      } else lsSet(k, v);
      if (!(k in mem)) mem[k] = v;
      return mem[k] == null ? null : { key: k, value: mem[k] };
    },
    set: async function (k, v) {
      mem[k] = v; lsSet(k, v);
      var col = await ready;
      if (col) {
        try { await enqueue(k, function () { return col.doc(slug(k)).set({ v: v, t: Date.now() }); }); } catch (e) {}
      }
      return { key: k, value: v };
    }
  };
})();

// ── Colors ────────────────────────────────────────────────────────────────────
const C = {
  bg: "#0A0A0F",

// ── Storage ───────────────────────────────────────────────────────────────────
async function load(key) {
  try {
    const r = await window.storage.get(key);
    return r ? JSON.parse(r.value) : null;
  } catch {
    return null;
  }
}
async function save(key, val) {
  try {
    await window.storage.set(key, JSON.stringify(val));
  } catch {}
}

// ── Weight memory (legacy single value — kept for backward compat) ────────────
async function loadWeights() {
  try {
    const r = await window.storage.get("exercise-weights");
    return r ? JSON.parse(r.value) : {};
  } catch {
    return {};

const GYM_DAYS = ["SA", "PA", "SB", "PB"];
function estimateRoutineMins(id) {
  const secs = ROUTINES[id].exercises.reduce((a, ex) => a + ex.sets * (40 + ex.rest) + 60, 0);
  return Math.round((secs / 60 + 5) / 5) * 5; // + calentamiento, redondeado a 5
}

// ── Programa por fechas ────────────────────────────────────────────────────────
let START_DATE = "2026-10-19"; // se cambia en Ajustes
const DELOAD_WEEKS = [7, 14, 21, 28];
function dayIndex(d) {
  const x = new Date(d);
  return Math.floor(new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime() / 86400000);
}
function startIndex() {
  const [y, m, dd] = START_DATE.split("-").map(Number);
  return Math.floor(new Date(y, m - 1, dd).getTime() / 86400000);
}
function getProgramWeek(date = new Date()) {
  const days = dayIndex(date) - startIndex();
  if (days < 0) return 0;
  return Math.floor(days / 7) + 1;
}
function daysToStart(date = new Date()) {
  return startIndex() - dayIndex(date);
}
const STAGES = {
  0: {
    label: "Etapa 0 · Línea base",
    kcal: null,
    prot: "—"
  },
  1: {
    label: "Etapa 1 · Estructura",
    kcal: "~1,900",
    prot: "130 g"
  },
  2: {
    label: "Etapa 2 · Déficit sostenido",
    kcal: "~1,850",
    prot: "140-150 g si creatinina y filtrado salen normales; si no, 130 g"
  },
  M: {
    label: "Semana de mantenimiento",
    kcal: "~2,350",
    prot: "130-150 g"
  },
  3: {
    label: "Etapa 3 · Acercamiento",
    kcal: "~1,800",
    prot: "140-150 g (misma condición)"
  },
  4: {
    label: "Etapa 4 · Aterrizaje",
    kcal: "~1,750",
    prot: "140-150 g (misma condición), sin recortar"
  },
  5: {
    label: "Etapa 5 · Mantenimiento",
    kcal: "sube ~100-150 por semana hasta ~2,250",
    prot: "se mantiene"
  }
};
function getStage(week = getProgramWeek()) {
  if (week <= 0) return 0;
  if (week <= 6) return 1;
  if (week <= 16) return 2;
  if (week === 17) return "M";
  if (week <= 25) return 3;
  if (week <= 31) return 4;
  return 5;
}
function weekLabel(week = getProgramWeek()) {
  if (week <= 0) return "Etapa 0 · Línea base";
  if (week > 31) return "Semana " + week + " · " + STAGES[5].label;
  return "Semana " + week + " de 31 · " + STAGES[getStage(week)].label;
}
function isDeloadWeek() {
  return DELOAD_WEEKS.includes(getProgramWeek());
}
function mondayIndex(date = new Date()) {
  const d = new Date(date);
  const dow = (d.getDay() + 6) % 7;
  return dayIndex(d) - dow;
}
function sessionsThisWeek(history) {
  const mon = mondayIndex();
  return history.filter(h => h.type === "gym" && h.routine && GYM_DAYS.includes(h.routine) && dayIndex(h.date) >= mon);
}
function parseRepRange(reps) {
  const s = String(reps);
  const m = s.match(/(\d+)\s*-\s*(\d+)/);
  const unit = s.includes("seg") ? " seg" : "";
  if (m) return {
    min: +m[1],
    max: +m[2],
    unit
  };
  const n = parseInt(s) || 0;
  return {
    min: n,
    max: n,
    unit
  };
}

    elapsed,
